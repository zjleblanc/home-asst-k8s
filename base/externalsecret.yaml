apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: home-assistant-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Renders every key fetched from Vault into Home Assistant's
        # secrets.yaml format so it can be mounted at /config/secrets.yaml
        # and referenced in configuration.yaml via `!secret <key>`.
        secrets.yaml: |
          {{- range $key, $value := . }}
          {{ $key }}: "{{ $value }}"
          {{- end }}
  dataFrom:
    - extract:
        key: gitops/home-assistant/home-assistant-cfg
